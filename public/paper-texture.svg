<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <!-- Fine paper fiber grain -->
    <filter id="fiber" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.012" numOctaves="4" seed="7" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
    </filter>
    <!-- Soft blotchy paper mottle -->
    <filter id="mottle" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" seed="21" stitchTiles="stitch" result="m"/>
      <feColorMatrix in="m" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- warm paper base -->
  <rect width="600" height="600" fill="#f4ece4"/>
  <!-- large soft mottle -->
  <rect width="600" height="600" filter="url(#mottle)" opacity="0.5"/>
  <!-- fine directional fiber -->
  <rect width="600" height="600" filter="url(#fiber)" opacity="0.5"/>
</svg>
