<svg xmlns="http://www.w3.org/2000/svg" width="200" height="248" viewBox="0 0 200 248">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6e8da"/>
      <stop offset="60%" stop-color="#f0d8cf"/>
      <stop offset="100%" stop-color="#e7c3bb"/>
    </linearGradient>
    <!-- perforated edge: white dots punched around the border via a mask -->
    <mask id="perf">
      <rect width="200" height="248" fill="white"/>
      <g fill="black">
        <!-- top + bottom perforations -->
        <!-- generated at 20px spacing -->
        <circle cx="10" cy="6" r="6"/><circle cx="30" cy="6" r="6"/><circle cx="50" cy="6" r="6"/><circle cx="70" cy="6" r="6"/><circle cx="90" cy="6" r="6"/><circle cx="110" cy="6" r="6"/><circle cx="130" cy="6" r="6"/><circle cx="150" cy="6" r="6"/><circle cx="170" cy="6" r="6"/><circle cx="190" cy="6" r="6"/>
        <circle cx="10" cy="242" r="6"/><circle cx="30" cy="242" r="6"/><circle cx="50" cy="242" r="6"/><circle cx="70" cy="242" r="6"/><circle cx="90" cy="242" r="6"/><circle cx="110" cy="242" r="6"/><circle cx="130" cy="242" r="6"/><circle cx="150" cy="242" r="6"/><circle cx="170" cy="242" r="6"/><circle cx="190" cy="242" r="6"/>
        <!-- left + right perforations -->
        <circle cx="6" cy="10" r="6"/><circle cx="6" cy="30" r="6"/><circle cx="6" cy="50" r="6"/><circle cx="6" cy="70" r="6"/><circle cx="6" cy="90" r="6"/><circle cx="6" cy="110" r="6"/><circle cx="6" cy="130" r="6"/><circle cx="6" cy="150" r="6"/><circle cx="6" cy="170" r="6"/><circle cx="6" cy="190" r="6"/><circle cx="6" cy="210" r="6"/><circle cx="6" cy="230" r="6"/>
        <circle cx="194" cy="10" r="6"/><circle cx="194" cy="30" r="6"/><circle cx="194" cy="50" r="6"/><circle cx="194" cy="70" r="6"/><circle cx="194" cy="90" r="6"/><circle cx="194" cy="110" r="6"/><circle cx="194" cy="130" r="6"/><circle cx="194" cy="150" r="6"/><circle cx="194" cy="170" r="6"/><circle cx="194" cy="190" r="6"/><circle cx="194" cy="210" r="6"/><circle cx="194" cy="230" r="6"/>
      </g>
    </mask>
  </defs>

  <!-- stamp paper with perforated edge -->
  <g mask="url(#perf)">
    <rect x="4" y="4" width="192" height="240" rx="3" fill="#fffdf9"/>
    <!-- inner printed panel -->
    <rect x="16" y="16" width="168" height="216" fill="url(#sky)"/>
    <!-- soft hills -->
    <path d="M16 180 Q70 150 110 176 T184 170 V232 H16 Z" fill="#cdb79a" opacity="0.7"/>
    <path d="M16 196 Q80 170 130 192 T184 190 V232 H16 Z" fill="#b79a86" opacity="0.7"/>
    <!-- two interlocking wedding rings -->
    <g fill="none" stroke="#a9625d" stroke-width="5">
      <circle cx="88" cy="96" r="26"/>
      <circle cx="116" cy="96" r="26"/>
    </g>
    <!-- thin frame -->
    <rect x="16" y="16" width="168" height="216" fill="none" stroke="#a9625d" stroke-opacity="0.5" stroke-width="2"/>
    <!-- labels -->
    <text x="100" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="2" fill="#8a5551">FOREVER</text>
    <text x="100" y="214" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="1" fill="#8a5551">K &amp; B · 2026</text>
  </g>
</svg>
